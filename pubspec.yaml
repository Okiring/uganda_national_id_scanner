name: national_id_scanner
description: Native PDF417 scanner for Ugandan National IDs (Android + iOS).
version: 1.0.2
homepage: https://github.com/uganda/national_id_scanner

environment:
  sdk: ^3.10.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.uganda.scanner
        pluginClass: NationalIdScannerPlugin
      ios:
        pluginClass: NationalIdScannerPlugin
